<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>CIRQA · Garmin dashboard</title>
    <meta name="theme-color" content="#204e40" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CIRQA" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script src="/pwa.js" defer></script>
    <style>
      :root {
        --bg: #f5f6f3;
        --paper: #fff;
        --ink: #202b28;
        --muted: #64716b;
        --line: #dfe5df;
        --green: #34705d;
        --blue: #527ca4;
        --amber: #a97825;
        --violet: #857ba8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.5 "Segoe UI",
          system-ui,
          sans-serif;
      }
      button,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      summary:focus-visible,
      select:focus-visible {
        outline: 3px solid #527ca4;
        outline-offset: 3px;
      }
      button {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        padding: 8px 14px;
      }
      button:hover {
        background: #edf2ed;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      main {
        max-width: 1180px;
        margin: auto;
        padding: 32px 32px 48px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 22px;
      }
      .brand {
        font-weight: 650;
        font-size: 21px;
        letter-spacing: -0.6px;
      }
      .brand span {
        font-size: 13px;
        font-weight: 400;
        color: var(--muted);
        letter-spacing: 0;
        margin-left: 12px;
      }
      .sync {
        text-align: right;
        font-size: 12px;
        color: var(--muted);
      }
      .sync button {
        margin-left: 12px;
      }
      h1 {
        font-size: 30px;
        font-weight: 550;
        letter-spacing: -0.8px;
        margin: 30px 0 3px;
      }
      h2 {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: -0.3px;
        margin: 0;
      }
      h3 {
        font-size: 14px;
        font-weight: 550;
        margin: 0;
      }
      .sub,
      .note {
        color: var(--muted);
        font-size: 12px;
      }
      .sub {
        margin: 0 0 24px;
      }
      .hero {
        display: grid;
        grid-template-columns: 1.05fr 1fr 1fr;
        gap: 18px;
      }
      .card {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 24px;
        min-width: 0;
      }
      .primary {
        border-top: 3px solid var(--green);
        padding-top: 22px;
      }
      .eyebrow {
        font-size: 13px;
        color: var(--muted);
      }
      .number {
        font-size: 52px;
        line-height: 1.2;
        letter-spacing: -2px;
        font-weight: 550;
        font-variant-numeric: tabular-nums;
        margin: 12px 0 4px;
      }
      .number small {
        font-size: 17px;
        font-weight: 400;
        letter-spacing: 0;
        color: var(--muted);
        margin-left: 5px;
      }
      .state {
        color: var(--green);
        font-weight: 600;
      }
      .rail {
        height: 7px;
        border-radius: 4px;
        background: #edf1ed;
        overflow: hidden;
        margin: 20px 0 10px;
      }
      .rail i {
        display: block;
        height: 100%;
        background: var(--green);
        border-radius: 4px;
      }
      .pair {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 12px;
        color: var(--muted);
      }
      .pair b {
        color: var(--ink);
        font-weight: 550;
      }
      .stagebar {
        display: flex;
        height: 18px;
        overflow: hidden;
        border-radius: 4px;
        margin: 20px 0 12px;
      }
      .stages {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px 14px;
        font-size: 12px;
      }
      .stages span {
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 6px;
        border-radius: 2px;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
        margin-top: 18px;
      }
      .metrics .card {
        padding: 20px;
      }
      .metrics .number {
        font-size: 32px;
        letter-spacing: -1px;
      }
      .native {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 32px;
        padding: 20px 0;
        border-bottom: 1px solid var(--line);
      }
      .native b {
        display: block;
        font-size: 18px;
        font-weight: 550;
      }
      .section {
        margin-top: 36px;
      }
      .sectionhead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }
      .segments {
        display: flex;
        gap: 3px;
        background: #e8ede7;
        padding: 3px;
        border-radius: 8px;
      }
      .segments button {
        border: 0;
        background: none;
        font-size: 12px;
        padding: 5px 12px;
      }
      .segments button[aria-pressed="true"] {
        background: #fff;
        box-shadow: 0 1px 2px #0001;
      }
      .charts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .chart {
        padding: 20px 22px 14px;
      }
      .charthead {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
      }
      .charthead strong {
        font-size: 20px;
        font-weight: 550;
        font-variant-numeric: tabular-nums;
      }
      .chart svg {
        width: 100%;
        height: auto;
        display: block;
        overflow: visible;
      }
      .chart text {
        font-family: "Segoe UI", sans-serif;
        font-size: 11px;
        fill: var(--muted);
      }
      .chart text.label {
        fill: var(--ink);
        font-size: 12px;
        font-weight: 550;
      }
      .chart .note {
        min-height: 18px;
      }
      .chart details {
        font-size: 12px;
        color: var(--muted);
        margin-top: 6px;
      }
      .chart table {
        width: 100%;
        border-collapse: collapse;
      }
      .chart td {
        padding: 3px;
        border-bottom: 1px solid var(--line);
      }
      summary {
        cursor: pointer;
      }
      .activity {
        display: grid;
        grid-template-columns: 130px 1fr 90px 90px;
        gap: 16px;
        padding: 14px 0;
        border-bottom: 1px solid var(--line);
        align-items: center;
      }
      .activity .value {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .activity small {
        color: var(--muted);
      }
      a.activity {
        color: inherit;
        text-decoration: none;
      }
      a.activity:hover {
        background: #edf2ed;
      }
      a.activity:focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 3px;
      }
      .activity:first-child {
        padding-top: 0;
      }
      .error {
        padding: 14px 18px;
        margin: 16px 0;
        border: 1px solid #d8bc83;
        background: #fff8e9;
        border-radius: 8px;
      }
      .empty {
        color: var(--muted);
        padding: 22px 0;
      }
      .unavailable {
        font-size: 12px;
        color: var(--muted);
        margin-top: 20px;
      }
      footer {
        border-top: 1px solid var(--line);
        margin-top: 36px;
        padding-top: 18px;
        color: var(--muted);
        font-size: 12px;
        display: flex;
        justify-content: space-between;
        gap: 20px;
      }
      .loading {
        padding: 60px 0;
        color: var(--muted);
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 850px) {
        .hero {
          grid-template-columns: 1fr 1fr;
        }
        .hero .primary {
          grid-column: 1/-1;
        }
        .metrics {
          grid-template-columns: 1fr 1fr;
        }
        .charts {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 540px) {
        main {
          padding: 20px 16px;
        }
        .brand span {
          display: block;
          margin: 0;
        }
        .sync {
          max-width: 190px;
        }
        .sync button {
          margin: 6px 0 0;
        }
        .hero {
          grid-template-columns: 1fr;
        }
        .card {
          padding: 20px;
        }
        .sectionhead {
          align-items: flex-start;
        }
        .activity {
          grid-template-columns: 1fr 70px;
          gap: 2px 10px;
        }
        .activity .when {
          grid-column: 1/-1;
        }
        .activity .hr {
          display: none;
        }
        .number {
          font-size: 44px;
        }
        footer {
          display: block;
        }
        .chart {
          padding: 18px 16px;
        }
      }
      .hero .card { display: flex; flex-direction: column; }
      .hero .primary {
        background: #204e40;
        border-color: #204e40;
        --ink: #fff;
        --muted: #d1e3da;
        color: var(--ink);
      }
      .primary .state { color: #d1e3da; }
      .primary .rail { background: #416c5d; }
      .primary .rail i { background: #c4e2cb !important; }
      .hero .card:nth-child(2) { background: #f0f5eb; }
      .hero .card:nth-child(3) { background: #eff3f8; }
      .hero .eyebrow { text-transform: uppercase; letter-spacing: 1px; font-size: 11px; font-weight: 650; }
      .hero .number { font-size: 64px; font-weight: 650; }
      .hero .stagebar { height: 28px; gap: 2px; }
      .hero .mini { margin-top: auto; padding-top: 22px; }
      .metric-card { display: flex; flex-direction: column; border-top: 3px solid var(--series); }
      .metric-card .mini { margin-top: auto; padding-top: 16px; }
      .metric-title { display: flex; align-items: center; gap: 9px; }
      .metric-icon { width: 30px; height: 30px; padding: 5px; border-radius: 8px; background: #f1f4f2; color: var(--series); flex-shrink: 0; }
      .metric-icon svg { display: block; width: 100%; height: 100%; }
      .metric-card .number { margin-top: 14px; font-size: 38px; }
      .mini { margin-top: 16px; color: var(--series, var(--green)); }
      .primary .mini { color: #c4e2cb; }
      .mini svg { display: block; width: 100%; height: 62px; }
      .mini-caption { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 10px; margin-top: 4px; }
      .mini .empty { font-size: 11px; padding: 12px 0; }
      .score-axis { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin: -5px 0 10px; }
      .goal { margin-top: 12px; }
      .goal .rail { margin: 6px 0; height: 5px; }
      .goal-label { font-size: 11px; color: var(--muted); }
      .native { margin-top: 22px; padding: 20px; background: #eaf0ea; border: 1px solid var(--line); border-radius: 14px; }
      .sectionhead h2 { font-size: 23px; }
      .chart { border-top: 3px solid var(--series, var(--line)); }
      .charthead strong { font-size: 27px; letter-spacing: -0.7px; }
      #activities { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .activity, .activity:first-child { grid-template-columns: 1fr auto; padding: 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); gap: 8px 14px; }
      .activity .when { grid-column: 1/-1; display: flex; justify-content: space-between; }
      .activity > div:nth-child(2) { font-size: 16px; font-weight: 600; }
      .activity .value { font-size: 18px; }
      .activity .hr { grid-column: 1/-1; text-align: left; font-size: 12px; color: var(--muted); display: block; }
      @media (max-width: 540px) {
        .sync { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
        .hero .number { font-size: 54px; }
        .metrics { gap: 10px; }
        .metrics .card { padding: 14px 12px; }
        .metric-title { align-items: flex-start; gap: 6px; }
        .metric-title h3 { font-size: 12px; }
        .metric-icon { width: 24px; height: 24px; padding: 4px; }
        .metric-card .number { font-size: 30px; }
        .metric-card .number small { font-size: 12px; }
        .mini-caption { flex-wrap: wrap; gap: 0 6px; }
        .sectionhead { flex-wrap: wrap; }
        #activities { grid-template-columns: 1fr; }
        .native { gap: 16px; padding: 16px; }
        .native > div { flex: 1 1 120px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="brand">CIRQA<span>Garmin Connect</span></div>
        <div class="sync">
          <span id="syncStatus">Checking data…</span
          ><button id="refresh" type="button">Sync now</button>
        </div>
      </header>
      <div id="error" class="error" role="alert" hidden></div>
      <div id="content" aria-live="polite">
        <div class="loading">Loading your Garmin data…</div>
      </div>
      <footer>
        <span
          >From Garmin Connect · stored on this PC.<br />Older history may
          include other Garmin devices.</span
        ><span
          >Cloud refresh every 30 minutes while open.<br />Sync your CIRQA in
          the iPhone app to upload new readings.</span
        >
      </footer>
    </main>
    <script>
      "use strict";
      const $ = (id) => document.getElementById(id),
        esc = (v) =>
          String(v ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
      const valid = (v) =>
        typeof v === "number" && Number.isFinite(v) && v >= 0;
      const num = (v, d = 0) =>
        valid(v)
          ? v.toLocaleString(undefined, { maximumFractionDigits: d })
          : "—";
      const hours = (s) =>
        valid(s)
          ? `${Math.floor(Math.round(s / 60) / 60)}h ${Math.round(s / 60) % 60}m`
          : "—";
      const dateLabel = (d) =>
        new Date(d + "T12:00:00").toLocaleDateString(undefined, {
          day: "numeric",
          month: "short",
        });
      const words = (v) =>
        typeof v === "string"
          ? v
              .toLowerCase()
              .replace(/_\d+$/, "")
              .replace(/_/g, " ")
              .replace(/^./, (c) => c.toUpperCase())
          : "";
      let days = [],
        overview = {},
        activities = [],
        range = 7,
        refreshing = false,
        syncPending = false,
        hosting = "local",
        lastLoaded = 0,
        lastStatus = {},
        dataSignature = "";
      const latest = (k) =>
        [...days].reverse().find((d) => valid(d[k])) || null;
      const stamp = (d) =>
        d
          ? `${dateLabel(d.date)}${d.date === overview.today ? " · today" : ""}`
          : "Not available from Garmin";
      const recorded = (d, key) =>
        `${stamp(d)}${d?.[key] ? " · " + d[key].slice(11, 16) : ""}`;
      const rail = (v, color = "var(--green)") =>
        valid(v)
          ? `<div class="rail"><i style="width:${Math.max(0, Math.min(100, v))}%;background:${color}"></i></div>`
          : "";
      const stages = [
        ["sleep_deep_s", "Deep", "#527ca4"],
        ["sleep_rem_s", "REM", "#857ba8"],
        ["sleep_light_s", "Light", "#b2c6d4"],
        ["sleep_awake_s", "Awake", "#d8b481"],
      ];
      const seriesColor = (k) =>
        ({ resting_hr: "#b47a56", stress_avg: "#a97825",
          hrv_last_night: "#527ca4", respiration_avg: "#857ba8",
          spo2_avg: "#527ca4", sleep_hours: "#527ca4",
          active_calories: "#a97825" })[k] || "#34705d";
      function metricIcon(k) {
        const paths = {
          resting_hr: "M3 12h4l3-7 4 14 3-7h4",
          hrv_last_night: "M3 12h3l3-5 3 10 3-10 3 5h3",
          stress_avg: "M4 17V9m5 8V5m6 12v-7m5 7V3",
          steps: "M7 3v7m-2 0h4v5H5zm12-1v7m-2 0h4v5h-4z",
          respiration_avg: "M12 3v9m0-4C5 5 3 11 3 17c0 4 7 3 7-1v-4m2-4c7-3 9 3 9 9 0 4-7 3-7-1v-4",
          active_calories: "M13 3c2 6-5 6-2 10 2 0 3-2 3-4 7 7 4 12-2 12S3 15 7 10c0 3 2 3 2 3-2-5 4-7 4-10",
          spo2_avg: "M12 3C9 8 5 12 5 16a7 7 0 0 0 14 0c0-4-4-8-7-13z",
        };
        return `<span class="metric-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="${paths[k] || paths.hrv_last_night}"/></svg></span>`;
      }
      function miniTrend(k, title, unit, bars = false) {
        const end = overview.today || days.at(-1)?.date;
        if (!end) return '<div class="mini"><div class="empty">No recorded history yet.</div></div>';
        const endMs = Date.parse(end + "T12:00:00Z");
        const byDate = new Map(days.map((d) => [d.date, d]));
        const rows = Array.from({ length: 7 }, (_, i) => {
          const date = new Date(endMs - (6 - i) * 86400000).toISOString().slice(0, 10);
          return { date, value: byDate.get(date)?.[k] };
        });
        const observed = rows.filter((d) => valid(d.value));
        const caption = `<div class="mini-caption"><span>${esc(dateLabel(rows[0].date))}–${esc(dateLabel(end))}</span><span>${observed.length}/7 days recorded</span></div>`;
        if (!observed.length) return `<div class="mini"><div class="empty">No readings in the last 7 days.</div>${caption}</div>`;
        const fixed = ["training_readiness", "body_battery_current", "sleep_score", "stress_avg"].includes(k);
        const min = bars || fixed ? 0 : Math.max(0, Math.min(...observed.map((d) => d.value)) - 2);
        const max = fixed ? 100 : Math.max(min + 1, ...observed.map((d) => d.value));
        const x = (i) => 12 + i * 38;
        const y = (v) => 49 - ((v - min) / (max - min)) * 40;
        let svg = '<path d="M12 50H240" stroke="currentColor" opacity=".15"/>';
        let prev = null;
        rows.forEach((d, i) => {
          if (!valid(d.value)) { prev = null; return; }
          const label = `${dateLabel(d.date)}: ${num(d.value, 1)} ${unit}`;
          if (bars) {
            svg += `<rect x="${x(i) - 9}" y="${y(d.value)}" width="18" height="${Math.max(1, 50 - y(d.value))}" rx="3" fill="currentColor" opacity="${i === 6 ? 1 : 0.5}"><title>${esc(label)}</title></rect>`;
          } else {
            if (prev !== null) svg += `<path d="M${x(prev)} ${y(rows[prev].value)}L${x(i)} ${y(d.value)}" fill="none" stroke="currentColor" stroke-width="2"/>`;
            svg += `<circle cx="${x(i)}" cy="${y(d.value)}" r="${i === 6 ? 4 : 2.5}" fill="currentColor"><title>${esc(label)}</title></circle>`;
            prev = i;
          }
        });
        return `<div class="mini" style="--series:${seriesColor(k)}"><svg viewBox="0 0 252 58" role="img" aria-label="${esc(title)}: ${observed.length} recorded days in the last 7 days. Gaps indicate missing readings.">${svg}</svg>${caption}</div>`;
      }
      function metric(k, title, unit, detail = "") {
        const d = latest(k);
        const goal = k === "steps" && valid(d?.steps_goal) && d.steps_goal > 0 && valid(d.steps)
          ? `<div class="goal"><div class="goal-label">${num((d.steps / d.steps_goal) * 100)}% of Garmin step goal · ${esc(stamp(d))}</div>${rail((d.steps / d.steps_goal) * 100)}</div>` : "";
        return `<article class="card metric-card" style="--series:${seriesColor(k)}"><div class="metric-title">${metricIcon(k)}<h3>${title}</h3></div><div class="number">${num(d?.[k], k === "spo2_avg" || k === "respiration_avg" ? 1 : 0)}<small>${unit}</small></div><div class="note">${esc(stamp(d))}</div>${detail ? `<div class="note">${detail}</div>` : ""}${goal}${miniTrend(k, title, unit, ["steps", "active_calories"].includes(k))}</article>`;
      }
      function render() {
        const r = latest("training_readiness"),
          b = latest("body_battery_current") || latest("body_battery_high"),
          s = latest("sleep_seconds"),
          h = latest("hrv_last_night");
        const sleepTotal = s
          ? stages.reduce((n, [k]) => n + (valid(s[k]) ? s[k] : 0), 0)
          : 0;
        const bodyVal = b?.body_battery_current;
        const sleepParts = s ? stages.filter(([k]) => valid(s[k])) : [];
        const native = [
          ["recovery_time_hours", "Recovery time", "h"],
          ["acute_load", "Acute load", ""],
          ["load_ratio", "Load ratio", "×"],
          ["vo2_max", "VO₂ max", "ml/kg/min"],
          ["intensity_minutes", "Intensity minutes (vigorous ×2)", "min"],
          ["total_calories", "Total calories", "kcal"],
        ]
          .map(([k, t, u]) => {
            const d = latest(k);
            return d
              ? `<div><span class="note">${t}</span><b>${num(d[k], 1)} <small>${u}</small></b><span class="note">${esc(stamp(d))}</span></div>`
              : "";
          })
          .join("");
        const status = [...days].reverse().find((d) => d.training_status);
        const tracked = [
          ["body_battery_high", "Body Battery"],
          ["spo2_avg", "Pulse Ox"],
          ["respiration_avg", "Respiration"],
          ["hrv_last_night", "HRV"],
        ];
        const missing = tracked.filter(([k]) => !latest(k)).map(([, t]) => t);
        $("content").innerHTML =
          `<h1>Your daily overview</h1><p class="sub">${esc(overview.today ? dateLabel(overview.today) : "")} · Latest available readings, dated individually. Daily totals are partial until the day ends.</p>
 <section class="hero" aria-label="Daily Garmin metrics">
 <article class="card primary"><div class="eyebrow">Garmin training readiness</div><div class="number">${num(r?.training_readiness)}<small>/ 100</small></div><div class="state">${esc(words(r?.training_readiness_level))}</div>${rail(r?.training_readiness)}<div class="note">${esc(recorded(r, "readiness_updated_at"))} · recorded score</div>${valid(r?.recovery_time_hours) ? `<div class="pair"><span>Recovery time</span><b>${num(r.recovery_time_hours, 1)} h</b></div>` : ""}</article>
 <article class="card"><div class="eyebrow">Body Battery</div><div class="number">${num(bodyVal)}<small>/ 100</small></div><div class="note">Latest recorded level · ${esc(recorded(b, "body_battery_updated_at"))}</div>${rail(bodyVal)}<div class="pair"><span>Daily high <b>${num(b?.body_battery_high)}</b></span><span>Daily low <b>${num(b?.body_battery_low)}</b></span></div></article>
 <article class="card"><div class="eyebrow">Sleep</div><div class="number" style="font-size:38px">${hours(s?.sleep_seconds)}</div><div class="pair"><span>${esc(stamp(s))}</span><span>Score <b>${num(s?.sleep_score)} / 100</b></span></div>${sleepTotal ? `<div class="stagebar">${sleepParts.map(([k, t, c]) => `<div style="width:${(s[k] / sleepTotal) * 100}%;background:${c}" title="${t}: ${hours(s[k])}"></div>`).join("")}</div><div class="stages">${sleepParts.map(([k, t, c]) => `<div><span style="background:${c}"></span>${t} <b>${hours(s[k])}</b></div>`).join("")}</div><div class="note" style="margin-top:8px">Awake time is separate from time asleep.</div>` : '<div class="empty">No sleep stages available.</div>'}</article></section>
 <section class="metrics" aria-label="Health and movement">${metric("hrv_last_night", "Overnight HRV", "ms", h ? `${esc(words(h.hrv_status))}${valid(h.hrv_weekly_avg) ? ` · 7-day ${num(h.hrv_weekly_avg)} ms` : ""}${valid(h.hrv_baseline_low) && valid(h.hrv_baseline_high) ? ` · Garmin band ${num(h.hrv_baseline_low)}–${num(h.hrv_baseline_high)} ms` : ""}` : "")}${metric("resting_hr", "Resting heart rate", "bpm")}${metric("stress_avg", "Average stress", "/ 100")}${metric("steps", "Steps", "", valid(latest("steps")?.steps_goal) ? `Goal ${num(latest("steps").steps_goal)}` : "")}${latest("spo2_avg") ? metric("spo2_avg", "Pulse Ox", "%") : ""}${latest("respiration_avg") ? metric("respiration_avg", "Respiration", "brpm") : ""}${latest("active_calories") ? metric("active_calories", "Active calories", "kcal") : ""}</section>
 ${native || status ? `<section class="native" aria-label="More Garmin metrics">${status ? `<div><span class="note">Garmin training status</span><b>${esc(words(status.training_status))}</b><span class="note">${esc(stamp(status))}</span></div>` : ""}${native}</section>` : ""}
 <section class="section"><div class="sectionhead"><div><h2>Trends</h2><div class="note">Gaps mean no reading. Labels show recorded values.</div></div><div class="segments" aria-label="Chart range">${[7, 28, 90].map((n) => `<button type="button" data-range="${n}" aria-pressed="${range === n}">${n} days</button>`).join("")}</div></div><div id="charts" class="charts"></div></section>
 <section class="section"><div class="sectionhead"><h2>Recent activities</h2><a href="/activities" style="color:var(--green)">All activities &rarr;</a></div><div id="activities"></div><div class="note" style="margin-top:12px">Open a session for charts, laps and zones. Latest 6 sessions; all recordings remain in history.</div></section>
 ${missing.length ? `<details class="unavailable"><summary>Unavailable metrics: ${esc(missing.join(", "))}</summary><p>No readings returned in the stored history. Device support, settings and Garmin Connect uploads determine availability.</p></details>` : ""}`;
        document.querySelectorAll("[data-range]").forEach(
          (btn) =>
            (btn.onclick = () => {
              range = Number(btn.dataset.range);
              render();
              document.querySelector(`[data-range="${range}"]`).focus();
            }),
        );
        renderCharts();
        const heroCards = document.querySelectorAll(".hero .card");
        [["training_readiness", "Training readiness", "/100", false],
         ["body_battery_current", "Body Battery", "/100", false],
         ["sleep_hours", "Time asleep", "h", true]].forEach(([key, title, unit, bars], i) => {
          heroCards[i].insertAdjacentHTML("beforeend", miniTrend(key, title, unit, bars));
        });
        document.querySelectorAll(".hero .rail").forEach((el) =>
          el.insertAdjacentHTML("afterend", '<div class="score-axis" aria-hidden="true"><span>0</span><span>50</span><span>100</span></div>'));
        document.querySelectorAll("#charts .chart").forEach((el) => {
          const title = el.querySelector("h3")?.textContent;
          const spec = chartSpecs.find((s) => s[1] === title);
          if (spec) el.style.setProperty("--series", spec[4]);
        });
        const acts = activities
          .filter((a) => valid(a.duration_s) && a.duration_s >= 60)
          .slice(0, 6);
        $("activities").innerHTML = acts.length
          ? acts
              .map(
                (a) =>
                  `<a class="activity" href="/activity?id=${encodeURIComponent(a.activity_id)}"><div class="when note">${a.start_local || a.start_iso ? esc(dateLabel((a.start_local || a.start_iso).slice(0, 10))) : "Date unavailable"} <small>${esc((a.start_local || a.start_iso || "").slice(11, 16))}</small></div><div>${esc(a.name || words(a.type) || "Activity")} &rarr;</div><div class="value">${num(a.duration_s / 60)} <small>min</small></div><div class="value hr">${num(a.avg_hr)} <small>bpm</small></div></a>`,
              )
              .join("")
          : '<div class="empty">No recorded activities available.</div>';
      }
      const chartSpecs = [
        ["training_readiness", "Training readiness", "/100", "bar", "#34705d"],
        [
          "body_battery_high",
          "Body Battery · daily range",
          "/100",
          "range",
          "#708d62",
        ],
        ["sleep_hours", "Time asleep", "h", "bar", "#527ca4"],
        ["sleep_score", "Sleep score", "/100", "bar", "#857ba8"],
        ["hrv_last_night", "Overnight HRV", "ms", "line", "#527ca4"],
        ["resting_hr", "Resting heart rate", "bpm", "line", "#b47a56"],
        ["stress_avg", "Average stress", "/100", "bar", "#a97825"],
        ["steps", "Steps", "steps", "bar", "#708d62"],
        ["spo2_avg", "Pulse Ox", "%", "line", "#527ca4"],
        ["respiration_avg", "Respiration", "brpm", "line", "#857ba8"],
      ];
      function renderCharts() {
        const end = overview.today || days.at(-1)?.date;
        if (!end) {
          $("charts").innerHTML =
            '<div class="empty">Sync Garmin Connect to start a history.</div>';
          return;
        }
        const endMs = Date.parse(end + "T12:00:00Z"),
          start = endMs - (range - 1) * 86400000,
          byDate = new Map(days.map((d) => [d.date, d]));
        const rows = Array.from({ length: range }, (_, i) => {
          const date = new Date(start + i * 86400000)
            .toISOString()
            .slice(0, 10);
          return byDate.get(date) || { date };
        });
        $("charts").innerHTML = chartSpecs
          .filter(([k]) => latest(k))
          .map(([k, title, unit, type, color]) => {
            const values = rows.map((d) => (valid(d[k]) ? d[k] : null)),
              observed = values.filter((v) => v !== null),
              dec =
                k === "sleep_hours" ||
                k === "spo2_avg" ||
                k === "respiration_avg"
                  ? 1
                  : 0;
            if (!observed.length)
              return `<article class="card chart"><h3>${title}</h3><div class="empty">No readings in these ${range} days.</div></article>`;
            const w = 500,
              height = 200,
              p = { l: 38, r: 32, t: 30, b: 32 },
              base = height - p.b;
            const lo =
              type === "line"
                ? Math.max(
                    0,
                    Math.min(...observed) -
                      Math.max(
                        2,
                        (Math.max(...observed) - Math.min(...observed)) * 0.25,
                      ),
                  )
                : 0;
            const hi =
              unit === "/100"
                ? 100
                : Math.max(...observed) * 1.15 +
                  (Math.max(...observed) === 0 ? 1 : 0);
            const X = (i) => p.l + ((i + 0.5) / range) * (w - p.l - p.r),
              Y = (v) => base - ((v - lo) / (hi - lo)) * (base - p.t),
              fmt = (v) => num(v, dec),
              bw = Math.min(30, ((w - p.l - p.r) / range) * 0.6);
            let svg = "";
            for (let i = 0; i < 3; i++) {
              const v = lo + ((hi - lo) * i) / 2,
                y = Y(v);
              svg += `<line x1="${p.l}" y1="${y}" x2="${w - p.r}" y2="${y}" stroke="#e8ece7"/><text x="${p.l - 7}" y="${y + 4}" text-anchor="end">${num(v, v < 10 ? 1 : 0)}</text>`;
            }
            const last = values.findLastIndex((v) => v !== null),
              min = values.indexOf(Math.min(...observed)),
              max = values.indexOf(Math.max(...observed));
            const labeled = [last];
            for (const index of [min, max]) {
              if (labeled.every((other) => Math.abs(other - index) > range / 6))
                labeled.push(index);
            }
            let prev = null;
            values.forEach((v, i) => {
              if (v === null) {
                prev = null;
                return;
              }
              const x = X(i),
                y = Y(v),
                label = `${dateLabel(rows[i].date)}: ${fmt(v)} ${unit}`;
              if (type === "line") {
                if (prev !== null)
                  svg += `<line x1="${X(prev)}" y1="${Y(values[prev])}" x2="${x}" y2="${y}" stroke="${color}" stroke-width="2"/>`;
                svg += `<circle cx="${x}" cy="${y}" r="3" fill="${color}"><title>${esc(label)}</title></circle>`;
                prev = i;
              } else if (type === "range") {
                const low = rows[i].body_battery_low;
                if (valid(low))
                  svg += `<rect x="${x - bw / 2}" y="${y}" width="${bw}" height="${Math.max(2, Y(low) - y)}" rx="3" fill="${color}"><title>${esc(dateLabel(rows[i].date))}: ${num(low)}–${fmt(v)}</title></rect>`;
              } else
                svg += `<rect x="${x - bw / 2}" y="${y}" width="${bw}" height="${Math.max(1, base - y)}" rx="3" fill="${color}" opacity=".8"><title>${esc(label)}</title></rect>`;
              if (range <= 7 || labeled.includes(i))
                svg += `<text class="label" x="${x}" y="${Math.max(14, y - 9)}" text-anchor="middle">${fmt(v)}</text>`;
            });
            [0, Math.floor((range - 1) / 2), range - 1].forEach(
              (i) =>
                (svg += `<text x="${X(i)}" y="${height - 8}" text-anchor="middle">${esc(dateLabel(rows[i].date))}</text>`),
            );
            return `<article class="card chart"><div class="charthead"><h3>${title}</h3><strong>${fmt(values[last])} <span class="note">${unit}</span></strong></div><div class="note">${observed.length} of ${range} days recorded · latest ${esc(dateLabel(rows[last].date))}</div><svg viewBox="0 0 ${w} ${height}" role="img" aria-label="${esc(title)} over ${range} days; latest ${fmt(values[last])} ${unit}">${svg}</svg><details><summary>View recorded values</summary><table><tbody>${rows
              .filter((d) => valid(d[k]))
              .map(
                (d) =>
                  `<tr><td>${esc(dateLabel(d.date))}</td><td>${fmt(d[k])} ${unit}</td></tr>`,
              )
              .join("")}</tbody></table></details></article>`;
          })
          .join("");
      }
      async function get(url, options) {
        const r = await fetch(url, options);
        if (r.status === 401) {
          location.replace("/login");
          throw Error("Sign in to continue");
        }
        const data = await r.json();
        if (!r.ok || data.ok === false)
          throw Error(data.error || "Request failed");
        return data;
      }
      function syncStatus(s) {
        lastStatus = s;
        const running = syncPending || !!s.running;
        $("refresh").disabled = running || !!s.busy;
        $("refresh").textContent = running ? "Syncing…" : s.busy ? "Activity syncing…" : "Sync now";
        const t = overview.last_sync?.finished_at;
        $("syncStatus").textContent = running
          ? "Updating from Garmin Connect…"
          : t
            ? `Synced ${new Date(t).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })}`
            : "Not synced yet";
        if (s.error) {
          $("error").hidden = false;
          $("error").textContent = s.error;
        }
      }
      async function load() {
        if (refreshing) return;
        refreshing = true;
        try {
          const data = await get("/api/dashboard");
          const signature = JSON.stringify([data.overview, data.days, data.activities]);
          overview = data.overview;
          days = data.days;
          activities = data.activities;
          hosting = data.hosting;
          lastLoaded = Date.now();
          $("error").hidden = true;
          if (signature !== dataSignature) {
            dataSignature = signature;
            render();
          }
          syncStatus(data.sync);
          return true;
        } catch (e) {
          $("error").hidden = false;
          $("error").textContent =
            `Unable to update the dashboard: ${e.message}. Existing data has not been deleted.`;
          return false;
        } finally {
          refreshing = false;
        }
      }
      async function sync() {
        if (syncPending || lastStatus.running || lastStatus.busy) return;
        syncPending = true;
        syncStatus(lastStatus);
        try {
          const s = await get("/api/sync", {
            method: "POST",
            headers: { "X-CIRQA-Request": "1" },
          });
          syncPending = false;
          await load();
          syncStatus(s);
          if (s.cooldown_seconds && !s.running) {
            $("syncStatus").textContent =
              `Next cloud refresh available in ${Math.ceil(s.cooldown_seconds / 60)} min`;
          }
        } catch (e) {
          $("error").hidden = false;
          $("error").textContent = e.message;
        } finally {
          syncPending = false;
          syncStatus(lastStatus);
        }
      }
      $("refresh").onclick = sync;
      load().then((loaded) => { if (loaded) sync(); });
      setInterval(() => {
        if (!document.hidden && (hosting !== "cloud" || syncPending || lastStatus.running || Date.now() - lastLoaded >= 60000)) load();
      }, 15000);
      setInterval(
        () => {
          if (!document.hidden) sync();
        },
        30 * 60 * 1000,
      );
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) load().then((loaded) => { if (loaded) sync(); });
      });
    </script>
  </body>
</html>
