<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>CIRQA · Garmin dashboard</title>
    <meta name="theme-color" content="#204e40" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CIRQA" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script src="/pwa.js" defer></script>
    <style>
      :root {
        --bg: #f3f6fb;
        --paper: #fff;
        --ink: #14213b;
        --muted: #56657a;
        --line: #e1e7ef;
        --green: #246bfd;
        --blue: #246bfd;
        --amber: #bb7b2c;
        --violet: #9270d8;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.5 Inter,
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      main {
        max-width: 1160px;
        margin: auto;
        padding: 24px 32px 48px;
      }
      button,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 15px;
        font-size: 12px;
        font-weight: 650;
        min-height: 42px;
      }
      button:hover {
        background: #edf2fc;
      }
      button:disabled {
        opacity: 0.55;
        cursor: wait;
      }
      button:focus-visible,
      summary:focus-visible,
      select:focus-visible,
      a:focus-visible {
        outline: 3px solid #729bff;
        outline-offset: 3px;
      }
      a {
        color: var(--blue);
        text-underline-offset: 4px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding-bottom: 22px;
      }
      .brand {
        font-size: 25px;
        font-weight: 850;
        letter-spacing: -1px;
        margin-right: auto;
      }
      .brand span {
        display: block;
        color: var(--muted);
        font-size: 9px;
        font-weight: 650;
        letter-spacing: 1.5px;
        margin-top: 3px;
      }
      .sync {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 10px;
        color: var(--muted);
      }
      .sync button {
        color: var(--blue);
        background: #e4ecff;
        border-color: transparent;
      }
      .app-nav {
        display: flex;
        gap: 8px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 14px;
        margin-bottom: 25px;
      }
      .app-nav a {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 18px;
        border-radius: 100px;
        color: var(--muted);
        text-decoration: none;
        font-size: 13px;
        font-weight: 650;
      }
      .app-nav a[aria-current="page"] {
        background: #e2ebff;
        color: #154dc3;
      }
      .app-nav svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      h1 {
        font-size: 36px;
        letter-spacing: -1.4px;
        line-height: 1.15;
        margin: 24px 0 8px;
        font-weight: 750;
      }
      h2 {
        font-size: 23px;
        letter-spacing: -0.7px;
        margin: 0;
        line-height: 1.3;
      }
      h3 {
        font-size: 13px;
        font-weight: 650;
        margin: 0;
      }
      .sub,
      .note {
        font-size: 11px;
        color: var(--muted);
      }
      .sub {
        margin: 0 0 20px;
      }
      .hero {
        display: grid;
        grid-template-columns: 1.25fr 1fr 1fr;
        gap: 16px;
      }
      .card {
        background: var(--paper);
        border: 0;
        border-radius: 24px;
        padding: 24px;
        min-width: 0;
      }
      .hero .card {
        display: flex;
        flex-direction: column;
      }
      .hero .primary {
        background: #12213b;
        --ink: #fff;
        --muted: #b9c8dd;
        color: #fff;
        display: grid;
        grid-template-columns: 140px minmax(0, 1fr);
        column-gap: 16px;
        align-items: center;
      }
      .readiness-ring {
        position: relative;
        width: 140px;
        height: 140px;
        grid-column: 1;
        grid-row: 2;
      }
      .readiness-ring svg {
        width: 100%;
        height: 100%;
      }
      .readiness-value {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      .readiness-value strong {
        font-size: 53px;
        line-height: 1;
        letter-spacing: -2.5px;
        font-weight: 700;
      }
      .readiness-value small {
        font-size: 10px;
        color: var(--muted);
        margin-top: 6px;
      }
      .primary > .eyebrow {
        grid-column: 1/-1;
        margin-bottom: 15px;
      }
      .readiness-meta {
        grid-column: 2;
        grid-row: 2;
      }
      .primary .state {
        color: #d3f56a;
        font-size: 17px;
        font-weight: 650;
      }
      .readiness-meta .note {
        font-size: 10px;
        margin-top: 9px;
      }
      .primary .mini {
        grid-column: 1/-1;
        color: #d3f56a;
        width: 100%;
        margin-top: 16px;
      }
      .primary .pair {
        margin-top: 14px;
        font-size: 10px;
        flex-direction: column;
        gap: 4px;
      }
      .hero .card:nth-child(2) {
        background: #dff3ec;
      }
      .hero .card:nth-child(3) {
        background: #eae5fb;
      }
      .eyebrow {
        color: var(--muted);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1.15px;
        font-weight: 700;
      }
      .number {
        font-size: 48px;
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: -2px;
        font-variant-numeric: tabular-nums;
        margin: 16px 0 8px;
      }
      .number small {
        font-size: 12px;
        font-weight: 400;
        letter-spacing: 0;
        color: var(--muted);
        margin-left: 6px;
      }
      .rail {
        height: 6px;
        background: #c9e2d8;
        border-radius: 10px;
        overflow: hidden;
        margin: 15px 0 8px;
      }
      .rail i {
        display: block;
        height: 100%;
        background: #2d9d80 !important;
        border-radius: 10px;
      }
      .pair {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 11px;
        color: var(--muted);
      }
      .pair b {
        color: var(--ink);
        font-weight: 650;
      }
      .stagebar {
        display: flex;
        height: 16px;
        gap: 2px;
        overflow: hidden;
        border-radius: 6px;
        margin: 15px 0 10px;
      }
      .stages {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px 10px;
        font-size: 10px;
      }
      .stages span {
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-right: 5px;
        border-radius: 2px;
      }
      .sleep-details {
        margin-top: 12px;
      }
      .sleep-details summary {
        font-size: 10px;
      }
      .hero .mini {
        margin-top: auto;
        padding-top: 15px;
      }
      .score-axis {
        display: flex;
        justify-content: space-between;
        font-size: 9px;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .train-link {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        text-decoration: none;
        color: var(--ink);
        background: #e2eaff;
        border-radius: 20px;
        padding: 20px 24px;
        margin: 18px 0 26px;
      }
      .train-link strong {
        display: block;
        font-size: 16px;
        letter-spacing: -0.3px;
      }
      .train-link small {
        display: block;
        font-size: 11px;
        color: #52678a;
        margin-top: 5px;
      }
      .train-link > span:last-child {
        font-size: 22px;
        color: var(--blue);
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin-top: 18px;
      }
      .metrics .card {
        padding: 20px;
      }
      .metric-card {
        display: flex;
        flex-direction: column;
      }
      .metric-title {
        display: flex;
        gap: 9px;
        align-items: center;
      }
      .metric-icon {
        width: 29px;
        height: 29px;
        padding: 5px;
        border-radius: 9px;
        background: #edf2fb;
        color: var(--series);
        flex-shrink: 0;
      }
      .metric-icon svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .metric-card .number {
        font-size: 35px;
        letter-spacing: -1.5px;
        margin-top: 14px;
      }
      .metric-card .mini {
        margin-top: auto;
        padding-top: 16px;
      }
      .mini {
        color: var(--series, var(--blue));
      }
      .mini svg {
        display: block;
        width: 100%;
        height: 52px;
      }
      .mini-caption {
        display: flex;
        justify-content: space-between;
        gap: 5px;
        color: var(--muted);
        font-size: 9px;
        margin-top: 4px;
      }
      .mini .empty {
        font-size: 11px;
        padding: 12px 0;
      }
      .goal {
        margin-top: 12px;
      }
      .goal .rail {
        margin: 7px 0;
        height: 5px;
      }
      .goal-label {
        font-size: 10px;
        color: var(--muted);
      }
      .native {
        display: flex;
        flex-wrap: wrap;
        gap: 18px 30px;
        padding: 22px;
        border-radius: 20px;
        background: #e8edf6;
        margin-top: 18px;
      }
      .native > div {
        flex: 1 1 130px;
      }
      .native b {
        display: block;
        font-size: 21px;
        font-weight: 650;
        letter-spacing: -0.5px;
      }
      .native small {
        font-size: 10px;
      }
      .section {
        margin-top: 26px;
      }
      .sectionhead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }
      .sectionhead a {
        font-size: 12px;
        font-weight: 600;
        text-decoration: none;
      }
      .disclosure {
        border-top: 1px solid var(--line);
        padding-top: 20px;
      }
      .disclosure > summary {
        font-size: 20px;
        letter-spacing: -0.4px;
        font-weight: 650;
        list-style: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .disclosure > summary:after {
        content: "+";
        font-size: 23px;
        color: var(--blue);
        font-weight: 400;
      }
      .disclosure[open] > summary:after {
        content: "−";
      }
      .disclosure .sectionhead {
        margin-top: 20px;
      }
      .segments {
        display: flex;
        gap: 3px;
        background: #e7edf6;
        border-radius: 12px;
        padding: 4px;
      }
      .segments button {
        border: 0;
        background: none;
        font-size: 11px;
        padding: 6px 12px;
        min-height: 34px;
      }
      .segments button[aria-pressed="true"] {
        background: #fff;
        color: var(--blue);
      }
      .charts {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      .chart {
        padding: 22px;
      }
      .charthead {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
      }
      .charthead strong {
        font-size: 26px;
        font-weight: 650;
        letter-spacing: -0.7px;
        font-variant-numeric: tabular-nums;
      }
      .chart svg {
        width: 100%;
        height: auto;
        display: block;
        overflow: visible;
      }
      .chart text {
        font-family: inherit;
        font-size: 11px;
        fill: var(--muted);
      }
      .chart text.label {
        fill: var(--ink);
        font-size: 12px;
        font-weight: 600;
      }
      .chart .note {
        min-height: 18px;
      }
      .chart details {
        font-size: 11px;
        color: var(--muted);
        margin-top: 8px;
      }
      .chart table {
        width: 100%;
        border-collapse: collapse;
      }
      .chart td {
        padding: 5px;
        border-bottom: 1px solid var(--line);
      }
      summary {
        cursor: pointer;
      }
      #activities {
        display: grid;
        gap: 8px;
      }
      .activity {
        display: grid;
        grid-template-columns: 95px 1fr 90px 90px;
        gap: 18px;
        align-items: center;
        padding: 18px 22px;
        border-radius: 17px;
        background: white;
        text-decoration: none;
        color: var(--ink);
      }
      .activity:hover {
        background: #e8eef9;
      }
      .activity .when {
        font-size: 10px;
      }
      .activity .when small {
        display: block;
      }
      .activity > div:nth-child(2) {
        font-size: 13px;
        font-weight: 600;
      }
      .activity .value {
        text-align: right;
        font-size: 20px;
        letter-spacing: -0.5px;
        font-variant-numeric: tabular-nums;
      }
      .activity small {
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 0;
      }
      .activity .hr {
        font-size: 13px;
        color: var(--muted);
      }
      .error {
        padding: 16px;
        border-radius: 12px;
        background: #fff0db;
        color: #785516;
        margin: 16px 0;
      }
      .empty {
        color: var(--muted);
        padding: 22px 0;
        font-size: 12px;
      }
      .unavailable {
        font-size: 11px;
        color: var(--muted);
        margin-top: 20px;
      }
      footer {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        border-top: 1px solid var(--line);
        margin-top: 32px;
        padding-top: 18px;
        font-size: 10px;
        color: var(--muted);
      }
      .loading {
        padding: 50px 0;
        color: var(--muted);
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 1000px) {
        .hero {
          grid-template-columns: 1fr 1fr;
        }
        .hero .primary {
          grid-column: 1/-1;
          grid-template-columns: 140px 1fr 1.2fr;
          gap: 10px 24px;
        }
        .primary > .eyebrow {
          grid-column: 1/3;
          margin: 0;
        }
        .readiness-ring {
          grid-row: 2;
        }
        .readiness-meta {
          grid-row: 2;
        }
        .hero .primary .mini {
          grid-column: 3;
          grid-row: 1/3;
          margin: 0;
          padding: 0;
        }
        .metrics {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 760px) {
        main {
          padding: 20px 20px calc(98px + env(safe-area-inset-bottom));
        }
        header {
          gap: 6px;
          padding-bottom: 10px;
        }
        .brand {
          font-size: 23px;
        }
        .brand span {
          font-size: 8px;
          letter-spacing: 1.1px;
        }
        .sync {
          flex-direction: column;
          align-items: flex-end;
          gap: 5px;
          font-size: 9px;
        }
        .sync button {
          font-size: 10px;
          padding: 8px 11px;
          min-height: 34px;
        }
        header > button {
          font-size: 10px !important;
          padding: 7px !important;
          min-height: 34px;
        }
        .app-nav {
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          z-index: 5;
          justify-content: space-around;
          margin: 0;
          padding: 9px 12px calc(9px + env(safe-area-inset-bottom));
          background: #ffffffed;
          backdrop-filter: blur(16px);
          border-top: 1px solid var(--line);
          border-bottom: 0;
        }
        .app-nav a {
          flex: 1;
          flex-direction: column;
          gap: 4px;
          font-size: 10px;
          padding: 6px 4px;
          border-radius: 14px;
          max-width: 110px;
        }
        .app-nav svg {
          width: 21px;
          height: 21px;
        }
        h1 {
          font-size: 30px;
          margin: 20px 0 7px;
          letter-spacing: -1px;
        }
        .sub {
          font-size: 10px;
          margin-bottom: 18px;
        }
        .hero {
          gap: 12px;
        }
        .card {
          padding: 18px;
          border-radius: 21px;
        }
        .hero .primary {
          grid-template-columns: 130px minmax(0, 1fr);
          gap: 8px 14px;
          padding: 22px;
        }
        .readiness-ring {
          width: 130px;
          height: 130px;
        }
        .hero .primary .mini {
          grid-column: 1/-1;
          grid-row: 3;
          margin-top: 5px;
          padding: 0;
        }
        .primary .mini svg {
          height: 36px;
        }
        .primary .eyebrow {
          font-size: 9px;
        }
        .primary .state {
          font-size: 17px;
        }
        .readiness-meta .note {
          font-size: 9px;
        }
        .primary .pair {
          font-size: 10px;
          margin-top: 12px;
        }
        .eyebrow {
          font-size: 9px;
          letter-spacing: 0.8px;
        }
        .hero .number {
          font-size: 39px;
          margin: 12px 0 8px;
        }
        .hero .number small {
          font-size: 10px;
        }
        .hero .note,
        .hero .pair {
          font-size: 9px;
        }
        .hero .mini svg {
          height: 40px;
        }
        .hero .mini-caption {
          font-size: 8px;
          flex-wrap: wrap;
        }
        .hero .stagebar {
          height: 13px;
        }
        .hero .stages {
          grid-template-columns: 1fr;
          font-size: 9px;
        }
        .hero .sleep-number {
          font-size: 30px;
        }
        .hero .mini {
          padding-top: 12px;
        }
        .train-link {
          padding: 18px 20px;
          margin: 14px 0 24px;
        }
        .train-link strong {
          font-size: 15px;
        }
        .train-link small {
          font-size: 10px;
        }
        .metrics {
          gap: 12px;
        }
        .metrics .card {
          padding: 17px 14px;
        }
        .metric-title {
          gap: 6px;
          align-items: flex-start;
        }
        .metric-title h3 {
          font-size: 11px;
        }
        .metric-icon {
          width: 24px;
          height: 24px;
          padding: 4px;
        }
        .metric-card .number {
          font-size: 29px;
        }
        .metric-card .number small {
          font-size: 11px;
        }
        .mini-caption {
          flex-wrap: wrap;
          font-size: 8px;
        }
        .metric-card .note {
          font-size: 10px;
        }
        .metric-card .mini svg {
          height: 45px;
        }
        .charts {
          grid-template-columns: 1fr;
        }
        .chart {
          padding: 20px 16px;
        }
        .charthead strong {
          font-size: 24px;
        }
        .sectionhead {
          flex-wrap: wrap;
        }
        .sectionhead h2 {
          font-size: 21px;
        }
        .disclosure > summary {
          font-size: 19px;
        }
        .native {
          gap: 16px;
          padding: 18px;
        }
        .activity {
          grid-template-columns: 1fr 65px;
          gap: 5px 10px;
          padding: 16px 18px;
        }
        .activity .when {
          grid-column: 1/-1;
          display: flex;
          gap: 8px;
        }
        .activity .value {
          font-size: 18px;
        }
        .activity .hr {
          grid-column: 1/-1;
          text-align: left;
          font-size: 11px;
        }
        .activity > div:nth-child(2) {
          font-size: 13px;
        }
        .section {
          margin-top: 24px;
        }
        footer {
          display: block;
          font-size: 9px;
        }
        footer > span {
          display: block;
          margin-bottom: 10px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="brand">CIRQA<span>TRAINING COMPANION</span></div>
        <div class="sync">
          <span id="syncStatus">Checking data…</span
          ><button id="refresh" type="button">Sync now</button>
        </div>
      </header>
      <nav class="app-nav" aria-label="Main navigation">
        <a href="/" aria-current="page"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m3 11 9-8 9 8M5 10v11h5v-7h4v7h5V10" /></svg
          >Today</a
        ><a href="/training"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m5 17 4-6 4 2 3-6M3 17h3m8-10h3v3M11 4h2" /></svg
          >Training</a
        ><a href="/activities"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 4h14v17H5zM8 8h8M8 12h8M8 16h5" /></svg
          >Activities</a
        >
      </nav>
      <div id="error" class="error" role="alert" hidden></div>
      <div id="content" aria-live="polite">
        <div class="loading">Loading your Garmin data…</div>
      </div>
      <footer>
        <span
          >From Garmin Connect · stored on this PC.<br />Older history may
          include other Garmin devices.</span
        ><span
          >Cloud refresh every 30 minutes while open.<br />Sync your CIRQA in
          the iPhone app to upload new readings.</span
        >
      </footer>

        document.querySelectorAll("[data-range]").forEach(

      const chartSpecs = [

      async function get(url, options) {

          syncPending = false;
          await load();
          syncStatus(s);
          if (s.cooldown_seconds && !s.running) {
            $("syncStatus").textContent =
              `Next cloud refresh available in ${Math.ceil(s.cooldown_seconds / 60)} min`;
          }
        } catch (e) {
          $("error").hidden = false;
          $("error").textContent = e.message;
        } finally {
          syncPending = false;
          syncStatus(lastStatus);
        }
      }
      $("refresh").onclick = sync;
      load().then((loaded) => {
        if (loaded) sync();
      });
      setInterval(() => {
        if (
          !document.hidden &&
          (hosting !== "cloud" ||
            syncPending ||
            lastStatus.running ||
            Date.now() - lastLoaded >= 60000)
        )
          load();
      }, 15000);
      setInterval(
        () => {
          if (!document.hidden) sync();
        },
        30 * 60 * 1000,
      );
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden)
          load().then((loaded) => {
            if (loaded) sync();
          });
      });
    </script>
  </body>
</html>
